# Arm A: finetune sweep -- fixed seed, epochs varied {1, 3, 10}, to see how many finetune epochs
# the pretrained-then-finetuned T5 needs. pretrained_model_path points at pretrain_10ep.yaml's
# final checkpoint (outputs/pretrain/final); run pretrain_10ep first.

seed: 42
tokenizer_path: outputs/tokenizer/tokenizer.model
pretrained_model_path: outputs/pretrain/final

train_split: train
validation_split: validation
max_seq_length: 512

epochs: 3
# effective batch 64 = 8 x 8 (see pretrain_10ep.yaml); 64 per-device OOMs 16 GB at seq 512
batch_size: 8
gradient_accumulation_steps: 8
lr: 5.0e-5
warmup_steps: 500

output_dir: outputs/finetune_A_ep3

model:
  d_model: 512
  d_ff: 2048
  d_kv: 64
  num_heads: 8
  num_layers: 6
  num_decoder_layers: 6
