[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pop"
version = "0.1.0"
description = "pretrain-or-prompt: does pretraining a small T5 beat prompting a larger LLM with RAG for Java bug fixing?"
readme = "README.md"
# Floor 3.11 (not 3.12): Google Colab runtimes may lag a Python version behind; keep source
# 3.11-compatible so `pip install -e .` works there.
# Ceiling 3.13: tree-sitter 0.22.x -- the only line codebleu 0.7.0 accepts, see the comment on the
# pin below -- publishes wheels for cp39-cp312 only, and its sdist needs a C toolchain. Without this
# bound the `%pip install -q -e .` in every `notebooks/colab_*.ipynb` fails on 3.13+ deep inside a
# C extension build, with the reason swallowed by `-q`; with it, pip says `Package 'pop' requires a
# different Python`. Colab's default is still 3.12, so this costs nothing today. Lift it together
# with the tree-sitter pins, once codebleu lifts its cap.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    "sentencepiece",
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "tqdm",
    "codebleu",
    # Held back deliberately, not stale. codebleu 0.7.0 (the current release) declares
    # `tree-sitter>=0.22,<0.23`, and tree-sitter 0.22.x accepts only grammar ABI 13-14
    # (LANGUAGE_VERSION=14, MIN_COMPATIBLE_LANGUAGE_VERSION=13). tree-sitter-java 0.21.0 is the
    # newest ABI-14 build; 0.23+ ships ABI-15 grammars and fails to load here with
    # `TypeError: an integer is required`. These two move only when codebleu lifts its cap.
    "tree-sitter>=0.22,<0.23",
    "tree-sitter-java==0.21.0",
    "bm25s",
    "faiss-cpu",
    "wandb",
    "peft>=0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "nbformat",
    "matplotlib",
    "mkdocs",
]

[project.scripts]
pop = "pop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pop"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "nbformat",
    "matplotlib",
    "mkdocs",
]

[tool.uv]
# `tokenizers` is transitive (via transformers), so it is constrained here rather than declared as
# a dependency the package does not import. Held at 0.22.x deliberately: it is the tokenizer runtime
# behind every Qwen and CodeBERT number in `docs/report.md`, those results are committed under
# `results/` and are never recomputed, and a tokenization change would silently desynchronise the
# report from the code. transformers 5.14.1 caps it at <=0.23.0 anyway, so the only available move
# is a minor bump with no security or feature driver. Revisit when the study is re-run end to end.
constraint-dependencies = ["tokenizers<0.23"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# --strict-markers: without it a typo'd `@pytest.mark.jkd` is silently accepted, so a test
# meant to be excluded from CI's `-m "not jdk"` selection runs there anyway (and fails on a
# runner with no JDK). --strict-config does the same for typos in this section.
addopts = "--strict-markers --strict-config"
markers = [
    "jdk: marks tests that require a local JDK installation",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `notebooks/` holds Colab launcher notebooks with IPython-magic cells (`%cd`, `!pop ...`) that
# aren't valid standalone Python and aren't part of the `pop` package; excluded from lint/format.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
