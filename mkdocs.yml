site_name: pretrain-or-prompt
site_description: >-
  Does pretraining a small T5 beat prompting/adapting a larger LLM for Java bug
  fixing? A four-arm study with an honest-negatives writeup.
docs_dir: docs
use_directory_urls: true

# Where the built site is served from. Without this, mkdocs emits an empty `sitemap.xml` and builds
# `404.html` against `/` -- so on a project Pages site (served under /<repo>/) every stylesheet,
# script and icon the 404 page asks for resolves one directory too high and 404s in turn, leaving an
# unstyled error page. Keep this in step with the Pages deployment.
site_url: https://yib7.github.io/Strats-for-Bug-Fixing/

# Puts a "GitHub" link in the theme's sidebar, so a reader who arrives on the site can get to the
# code without having to guess the URL.
repo_url: https://github.com/yib7/Strats-for-Bug-Fixing
repo_name: yib7/Strats-for-Bug-Fixing

theme:
  name: readthedocs
  # The theme's default (`highlightjs: true`) injects highlight.js and its stylesheet from
  # cdnjs.cloudflare.com into every page -- unpinned, without Subresource Integrity. On the
  # published site that means every visitor executes third-party JavaScript and hands a CDN
  # their IP and User-Agent. Off; the `codehilite` extension below highlights with Pygments
  # at build time instead, so the site makes no third-party requests.
  highlightjs: false

extra_css:
  - css/pygments.css
  - css/extra.css

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Study report: report.md
  - Measurement notes: measurement.md

# The operational runbooks and the results inventory live under docs/ for readers who
# reproduce the study from the repo, but are not part of the published narrative site;
# excluding them keeps `mkdocs build` warning-free. `media/` holds the README's GIF and
# screenshot: ~6 MB that only github.com renders, so it is kept out of the published site.
exclude_docs: |
  gpu-reproduction.md
  colab-runbook.md
  gpu-runbook.md
  results-manifest.md
  figures/*.mmd
  media/

markdown_extensions:
  - tables
  - fenced_code
  # Build-time syntax highlighting (Pygments), replacing the theme's CDN-hosted
  # highlight.js. Styling comes from the locally served docs/css/pygments.css.
  - codehilite
  - admonition
  - toc:
      permalink: true
