site_name: pretrain-or-prompt
site_description: >-
  Does pretraining a small T5 beat prompting/adapting a larger LLM for Java bug
  fixing? A four-arm study with an honest-negatives writeup.
docs_dir: docs
use_directory_urls: true

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Study report: report.md
  - Measurement notes: measurement.md

# Internal process docs and the Colab handoff notes live under docs/ but are not
# part of the published site; excluding them keeps `mkdocs build` warning-free.
exclude_docs: |
  handoff.md
  colab-runbook.md
  gpu-runbook-final.md
  results-manifest.md

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
