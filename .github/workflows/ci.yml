name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not `@v9`: setup-uv stopped publishing floating major/minor tags at v8.0.0,
        # so `v7` is the newest `@vN` that resolves at all. Bump by editing this line.
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test (excluding JDK-dependent tests)
        run: uv run pytest -m "not jdk"

      - name: Execution harness smoke (2 QuixBugs reference bugs, real JDK)
        run: uv run pop execbench --validate-references --bench quixbugs --limit 2
