name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not `@v9`: setup-uv stopped publishing floating major/minor tags at v8.0.0,
        # so `v7` is the newest `@vN` that resolves at all. Bump by editing this line.
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test (excluding JDK-dependent tests)
        run: uv run pytest -m "not jdk"

      - name: Execution harness smoke (2 QuixBugs reference bugs, real JDK)
        # Writes results/execbench_local_validate_references.json -- the gitignored scratch
        # name. It must never land on results/execbench_validate_references.json, which is
        # the committed 201/201 reference validation docs/report.md cites.
        run: uv run pop execbench --validate-references --bench quixbugs --limit 2

      - name: CPU reproduce path (smoke + figures + docs)
        # The three commands the README tells every visitor to run. They were never
        # exercised in CI despite being the primary user journey; all three are fast
        # (~9s / ~1s / ~1s).
        run: |
          uv run pop smoke
          uv run python scripts/figures/make_all.py
          uv run python -m mkdocs build

      - name: Working tree must be clean after the reproduce path
        # The guard that would have caught both the results-clobbering bug and the CRLF
        # churn before they were ever committed: running the documented commands must not
        # modify a single tracked file.
        run: git diff --exit-code
