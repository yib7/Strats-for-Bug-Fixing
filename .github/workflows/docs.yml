name: Docs

# Builds the MkDocs site and publishes it to GitHub Pages at
# https://yib7.github.io/pretrain-or-prompt/
#
# Pages is set to build from GitHub Actions, so the site tracks `main`: every push here rebuilds
# and redeploys it. `workflow_dispatch` stays on so the site can be rebuilt by hand without an
# empty commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; let a newer commit supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # --strict turns a broken internal link or a missing nav page into a failed build, so a
      # docs regression is caught here rather than shipped to the site.
      - name: Build the site
        run: uv run python -m mkdocs build --strict

      - name: Upload the built site
        # v4 stopped including dotfiles in the artifact. `mkdocs build` emits none into `site/`
        # (checked: no dot-prefixed entries), so the site is unaffected -- but a future dotfile
        # there, a `.nojekyll` say, would be dropped silently rather than fail the build.
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
